name: Deploy docs

on:
  push:
    branches: [prod]

permissions:
  id-token: write   # required for OIDC — the #1 cause of "could not load credentials"
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # let an in-flight deploy finish rather than half-syncing S3

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync ./dist s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }}
          --paths "/*"

  # The outcome card (.github/actions/discord-notify — the same action
  # sndwrks-local and sndwrks-cloud use). This is the workflow that actually
  # changes docs.sndwrks.com, so it reports success as well as failure.
  #
  # !cancelled() rather than always(): always() also fires on cancellation, and a
  # superseded run should die silently rather than post a card nobody is waiting
  # on. The ${{ }} wrapper is mandatory — a bare `!` is a reserved YAML tag
  # indicator.
  #
  # The job-level permissions block REPLACES the workflow-level one, deliberately
  # dropping id-token: write — this job talks to nothing but the GitHub API and
  # the webhook, and has no business minting OIDC tokens.
  notify-discord:
    if: ${{ !cancelled() }}
    needs: [deploy]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout the notify action
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Notify Discord
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          needs-json: ${{ toJSON(needs) }}
